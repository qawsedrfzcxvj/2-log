<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テーブルゲーム点数計算</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; line-height: 1.5; }
    .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
    h2, h3 { margin-top: 0; }
    input, select, button { padding: 6px; margin: 4px 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="loginBox" class="box">
    <h2>プレイヤーログイン / 新規登録</h2>
    <input type="text" id="usernameInput" placeholder="プレイヤー名を入力">
    <button onclick="login()">入室</button>
  </div>

  <div id="mainApp" class="hidden">
    <p>ログイン中: <strong id="currentUserDisplay"></strong> <button onclick="logout()">ログアウト</button></p>

    <div id="rankingBox" class="box hidden">
      <h3>🏆 所持ポイントランキング</h3>
      <table>
        <thead><tr><th>順位</th><th>プレイヤー名</th><th>所持ポイント</th><th id="banHeader" class="hidden">管理</th></tr></thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>

    <div class="box">
      <h3>🎲 ゲーム進行</h3>
      <div id="gameStatusText"></div>

      <div id="waitingArea" class="hidden">
        <p><strong>[ゲームマスター操作]</strong></p>
        参加人数: <input type="number" id="targetCountInput" value="4" min="2" style="width: 60px;">
        <button onclick="startGame()">新規ゲーム開始</button>
      </div>

      <div id="playingArea" class="hidden">
        <p>参加者 (<span id="joinedCount"></span>/<span id="totalCount"></span>人): <span id="participantList"></span></p>
        <p id="lastPlaceLossPreview" style="color: #b45309; font-weight: bold;"></p>
        <button id="joinBtn" onclick="joinGame()">このゲームに参加する</button>

        <div id="inputForm" class="hidden" style="margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px;">
          <p>あなたの結果を入力してください (全員入力で自動計算)</p>
          順位 (a): <input type="number" id="inputA" min="1" style="width: 50px;"><br>
          枚数 (b): <input type="number" id="inputB" style="width: 50px;"><br>
          サイコロ (c): <input type="number" id="inputC" style="width: 50px;"><br>
          <button id="submitBtn" onclick="submitInput()">送信</button>
          <p id="inputStatus" style="color: green; font-weight: bold;"></p>
        </div>
      </div>
    </div>

    <div id="adminPanel" class="box hidden" style="background: #f9f9f9;">
      <h3>⚙️ 管理者メニュー</h3>
      <div>
        <button id="undoBtn" onclick="undoAction()" disabled>1つ前の変更に戻す</button>
        <button onclick="downloadRankingCsv()">ランキングCSVダウンロード</button>
      </div>
      <div style="margin-top: 10px;">
        CSV反映: <input type="file" id="csvFileInput" accept=".csv,text/csv" onchange="importRankingCsv(this)">
      </div>
      <div style="margin-top: 10px;">
        <button onclick="forceResetGame()">進行中ゲームを強制終了</button>
        <button onclick="resetAllPoints()" style="color: red;">全員の点数を0にリセット</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = localStorage.getItem('bg_username') || '';
    let currentState = null;

    if (currentUser) {
      socket.emit('login', currentUser);
      showMain();
    }

    socket.on('connect', () => {
      if (currentUser) {
        socket.emit('login', currentUser);
      }
    });

    function login() {
      const name = document.getElementById('usernameInput').value.trim();
      if (!name) return alert('名前を入力してください');
      currentUser = name;
      localStorage.setItem('bg_username', name);
      socket.emit('login', name);
      showMain();
    }

    function logout() {
      localStorage.removeItem('bg_username');
      location.reload();
    }

    function showMain() {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('currentUserDisplay').textContent = currentUser;
      document.getElementById('adminPanel').classList.toggle('hidden', currentUser !== 'ad');
      document.getElementById('banHeader').classList.toggle('hidden', currentUser !== 'ad');
    }

    function startGame() {
      if (currentUser !== 'ad') return;
      const targetCount = document.getElementById('targetCountInput').value;
      socket.emit('startGame', { username: currentUser, targetCount });
    }

    function joinGame() {
      socket.emit('joinGame', currentUser);
    }

    function submitInput() {
      const a = document.getElementById('inputA').value;
      const b = document.getElementById('inputB').value;
      const c = document.getElementById('inputC').value;
      if (!a || !b || !c) return alert('すべての数値を入力してください');
      socket.emit('submitInput', { username: currentUser, a, b, c });
    }

    function setUserPoints(targetUser, value) {
      if (currentUser !== 'ad') return;
      socket.emit('adminAction', { username: currentUser, type: 'setPoints', targetUser, points: Number(value) });
    }

    function undoAction() {
      if (currentUser !== 'ad') return;
      socket.emit('adminAction', { username: currentUser, type: 'undo' });
    }

    function banUser(targetUser) {
      if (currentUser !== 'ad') return;
      if (confirm(`${targetUser} をBANしますか？`)) {
        socket.emit('adminAction', { username: currentUser, type: 'banUser', targetUser });
      }
    }

    function resetAllPoints() {
      if (currentUser !== 'ad') return;
      if (confirm('本当に全員の点数を0にリセットしますか？')) {
        socket.emit('adminAction', { username: currentUser, type: 'resetAll' });
      }
    }

    function forceResetGame() {
      if (currentUser !== 'ad') return;
      socket.emit('adminAction', { username: currentUser, type: 'forceResetGame' });
    }

    function parseCsvLine(line) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(cur.trim());
          cur = '';
        } else {
          cur += ch;
        }
      }
      result.push(cur.trim());
      return result;
    }

    function importRankingCsv(inputEl) {
      if (currentUser !== 'ad' || !inputEl.files || !inputEl.files[0]) return;
      const file = inputEl.files[0];
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || '').replace(/^\uFEFF/, '');
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const entries = [];
        lines.forEach((line, idx) => {
          const cols = parseCsvLine(line);
          if (cols.length < 2) return;
          if (idx === 0 && (cols[0].includes('順位') || cols[0].includes('プレイヤー') || cols[1].includes('プレイヤー'))) {
            return;
          }
          const name = cols.length >= 3 ? cols[1] : cols[0];
          const rawPt = cols.length >= 3 ? cols[2] : cols[1];
          const pt = Number(String(rawPt).replace(/[^\d.-]/g, ''));
          if (name && !Number.isNaN(pt)) {
            entries.push({ name, points: pt });
          }
        });
        if (entries.length > 0) {
          socket.emit('adminAction', { username: currentUser, type: 'importCsv', entries });
        }
        inputEl.value = '';
      };
      reader.readAsText(file, 'UTF-8');
    }

    function getRankedUsers(state) {
      return Object.entries(state.users || {})
        .filter(([name]) => name !== 'ad' && !(state.banned || []).includes(name))
        .sort((a, b) => b[1].points - a[1].points);
    }

    function downloadRankingCsv() {
      if (!currentState || currentUser !== 'ad') return;
      const ranked = getRankedUsers(currentState);
      const rows = [['順位', 'プレイヤー名', '所持ポイント']];
      ranked.forEach(([name, data], idx) => {
        rows.push([idx + 1, name, data.points]);
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ranking.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function handleBanned() {
      localStorage.removeItem('bg_username');
      currentUser = '';
      alert('このユーザー名はBANされています。');
      location.reload();
    }

    function formatSigned(n) {
      return n > 0 ? `+${n}` : `${n}`;
    }

    socket.on('bannedNotice', (username) => {
      if (currentUser === username) {
        handleBanned();
      }
    });

    socket.on('userBanned', (username) => {
      if (currentUser === username) {
        handleBanned();
      }
    });

    socket.on('stateUpdate', (state) => {
      currentState = state;
      if (currentUser && (state.banned || []).includes(currentUser)) {
        handleBanned();
        return;
      }

      if (!currentUser) {
        document.getElementById('rankingBox').classList.add('hidden');
        return;
      }

      const isAdmin = currentUser === 'ad';
      document.getElementById('adminPanel').classList.toggle('hidden', !isAdmin);
      document.getElementById('banHeader').classList.toggle('hidden', !isAdmin);
      document.getElementById('undoBtn').disabled = !state.prevSnapshot;

      const game = state.game;
      const isPlaying = game.status === 'playing';
      document.getElementById('rankingBox').classList.toggle('hidden', isPlaying && !isAdmin);

      const rankedUsers = getRankedUsers(state);
      const tbody = document.getElementById('rankingBody');
      tbody.innerHTML = '';

      rankedUsers.forEach(([name, data], idx) => {
        const pointCell = isAdmin
          ? `<input type="number" value="${data.points}" style="width: 80px;" onchange="setUserPoints('${name}', this.value)"> pt`
          : `${data.points} pt`;
        const banCell = isAdmin ? `<td><button onclick="banUser('${name}')">BAN</button></td>` : '';
        tbody.innerHTML += `<tr><td>${idx + 1}位</td><td>${name}</td><td>${pointCell}</td>${banCell}</tr>`;
      });

      const waitingArea = document.getElementById('waitingArea');
      const playingArea = document.getElementById('playingArea');

      if (!isPlaying) {
        document.getElementById('gameStatusText').textContent = '現在ゲームは開始されていません。';
        waitingArea.classList.toggle('hidden', !isAdmin);
        playingArea.classList.add('hidden');
        document.getElementById('inputA').value = '';
        document.getElementById('inputB').value = '';
        document.getElementById('inputC').value = '';
        document.getElementById('inputStatus').textContent = '';
        document.getElementById('lastPlaceLossPreview').textContent = '';
        document.getElementById('submitBtn').textContent = '送信';
      } else {
        document.getElementById('gameStatusText').textContent = 'ゲーム進行中！';
        waitingArea.classList.add('hidden');
        playingArea.classList.remove('hidden');

        document.getElementById('joinedCount').textContent = game.participants.length;
        document.getElementById('totalCount').textContent = game.targetCount;
        document.getElementById('participantList').textContent = game.participants.join(', ') || 'なし';

        const inputs = game.inputs || {};
        const totalNonLastDelta = Object.values(inputs)
          .filter(v => !v.isLast)
          .reduce((acc, v) => acc + (Number(v.delta) || 0), 0);

        const isJoined = game.participants.includes(currentUser);
        const lossPreviewEl = document.getElementById('lastPlaceLossPreview');
        lossPreviewEl.textContent = isJoined
          ? `現在の最下位減少予定: ${formatSigned(-totalNonLastDelta)} pt`
          : '';

        const isFull = game.participants.length >= game.targetCount;
        document.getElementById('joinBtn').classList.toggle('hidden', isJoined || isFull);
        document.getElementById('inputForm').classList.toggle('hidden', !isJoined);

        const myInput = inputs[currentUser];
        const statusEl = document.getElementById('inputStatus');
        const submitBtn = document.getElementById('submitBtn');

        if (myInput) {
          submitBtn.textContent = '変更';
          if (myInput.isLast) {
            statusEl.textContent = `入力済み (最下位): 順位=${myInput.a}, 枚数=${myInput.b}, サイコロ=${myInput.c} (全員入力で最下位の減点が確定します)`;
          } else {
            statusEl.textContent = `入力済み: 得た点数 ${formatSigned(myInput.delta)} pt (順位=${myInput.a}, 枚数=${myInput.b}, サイコロ=${myInput.c})`;
          }
        } else {
          submitBtn.textContent = '送信';
          statusEl.textContent = '';
        }
      }
    });
  </script>
</body>
</html>
